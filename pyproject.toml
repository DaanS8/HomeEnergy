[project]
name = "home-energy"
version = "0.3.0"
description = "Electricity usage, day-ahead market prices, and home energy analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.32,<3", "cryptography>=43", "python-dotenv>=1,<2", "psycopg[binary]>=3.2,<4", "tzdata; sys_platform == 'win32'", "entsoe-py>=0.7.2,<0.9", "pandas>=2.2,<3", "matplotlib>=3.8,<4", "fastapi>=0.143,<1", "pydantic>=2,<3", "uvicorn>=0.30,<1"]

[dependency-groups]
dev = ["httpx2>=2.13,<3"]

[project.scripts]
home-energy = "home_energy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/home_energy"]
