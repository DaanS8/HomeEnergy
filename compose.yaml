name: home-energy

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:?Set PGDATABASE in .env}
      POSTGRES_USER: ${PGUSER:?Set PGUSER in .env}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  app:
    build: .
    image: home-energy:dev
    ports:
      - "8000:8000"
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${PGDATABASE:?Set PGDATABASE in .env}
      PGUSER: ${PGUSER:?Set PGUSER in .env}
      PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
      FUSIONSOLAR_USERNAME: ${FUSIONSOLAR_USERNAME:-}
      FUSIONSOLAR_PASSWORD: ${FUSIONSOLAR_PASSWORD:-}
      ENTSOE_API_KEY: ${ENTSOE_API_KEY:-}
    volumes:
      - ./.cache:/app/.cache
      - ./outputs:/app/outputs
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=8).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
